<!-- Favicon do CONDEX — versão simplificada da marca (prédios + balão de conversa).
     Mesma geometria do componente src/components/marca/marcaCondex.jsx,
     com traço mais grosso para continuar legível a 16px e fundo do balão
     branco (a aba do navegador é sempre clara). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 118 76" fill="none" role="img" aria-label="CONDEX">
  <defs>
    <!-- Prédio mais alto: azul-marinho na base -> ciano no topo -->
    <linearGradient id="favicon-bloco" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#123a8f"/>
      <stop offset="55%" stop-color="#1f6fd0"/>
      <stop offset="100%" stop-color="#33b6f0"/>
    </linearGradient>
    <!-- Balão: azul -> ciano -->
    <linearGradient id="favicon-balao" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f8fd6"/>
      <stop offset="100%" stop-color="#33c3f0"/>
    </linearGradient>
  </defs>

  <!-- Prédios em ascensão (gestão/administração) -->
  <g stroke="#001c3f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3"  y="44" width="24" height="28" rx="2"/>
    <rect x="32" y="24" width="26" height="48" rx="2"/>
  </g>
  <rect x="63" y="4" width="28" height="68" rx="2" stroke="url(#favicon-bloco)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Janelas -->
  <g fill="#001c3f">
    <rect x="8.5" y="51" width="5" height="5" rx="1"/>
    <rect x="17"  y="51" width="5" height="5" rx="1"/>
    <rect x="8.5" y="61" width="5" height="5" rx="1"/>
    <rect x="17"  y="61" width="5" height="5" rx="1"/>
    <rect x="38" y="31" width="5" height="5" rx="1"/>
    <rect x="47" y="31" width="5" height="5" rx="1"/>
    <rect x="38" y="42" width="5" height="5" rx="1"/>
    <rect x="47" y="42" width="5" height="5" rx="1"/>
    <rect x="38" y="53" width="5" height="5" rx="1"/>
    <rect x="47" y="53" width="5" height="5" rx="1"/>
    <rect x="69" y="13" width="5" height="5" rx="1"/>
    <rect x="78" y="13" width="5" height="5" rx="1"/>
    <rect x="69" y="24" width="5" height="5" rx="1"/>
    <rect x="78" y="24" width="5" height="5" rx="1"/>
    <rect x="69" y="35" width="5" height="5" rx="1"/>
    <rect x="78" y="35" width="5" height="5" rx="1"/>
  </g>

  <!-- Balão de conversa (comunicação), por cima do prédio -->
  <path d="M76 71 L95.05 66.74 A17 17 0 1 0 83.58 59.01 Z"
        fill="#ffffff" stroke="url(#favicon-balao)" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1f8fd6">
    <circle cx="91"   cy="50" r="3"/>
    <circle cx="98.5" cy="50" r="3"/>
    <circle cx="106"  cy="50" r="3"/>
  </g>
</svg>
