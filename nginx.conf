server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Redireciona todas as rotas para o index.html (essencial para react-router-dom)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache otimizado para os assets gerados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}